<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'sha256-2PBlJD7nUBSHF4Cqip77lAP27xMG9A4vVijuMD6+C0s='; img-src 'self' data: blob:; connect-src 'self' https://exrbwctegkzxurzwihvh.supabase.co; font-src 'self'; form-action 'none'; base-uri 'none'; object-src 'none'; style-src 'self' 'sha256-Ap/wiyMCny8yb4LLl3ZaAbpnECNG8gk2xGhKoeP25ys=' 'sha256-ZPcWx88KfPk6iiGUaxvgoOcPOZduN35aOh5DdiMHmnA='">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NitroSystem - Concursos</title>
<style>html,body{background:#0b1220;margin:0;}</style>
<script src="config.js"></script>
<script>
  // M-28 + M-31: chequeo de sesión antes de pintar el body.
  (function(){
    var s = leerSesion();
    if (!s || s.rol !== 'admin'){
      location.replace('acceso-denegado.html');

<style>
:root{
  --fondo:#0b1220; --tarjeta:#121c2e; --borde:#24344d; --texto:#eef3f8;
  --suave:#9fb0c3; --acento:#35d07f; --acento2:#1fa2ff; --aviso:#ffd33d;
  --rojo:#e05252;
}
*{box-sizing:border-box;}
body{margin:0; background:var(--fondo); color:var(--texto); font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; font-size:17px; line-height:1.5;}
.franja{height:6px;background:linear-gradient(90deg,var(--acento),var(--acento2));}
.cabecera{display:flex;gap:14px;align-items:center;padding:20px 16px;max-width:1100px;margin:0 auto;}
.logo{width:56px;height:56px;border-radius:14px;background:linear-gradient(135deg,var(--acento),var(--acento2));display:flex;align-items:center;justify-content:center;font-size:30px;flex:none;}
.ceja{color:var(--suave);letter-spacing:2px;text-transform:uppercase;font-size:17px;}
h1{margin:0;font-size:26px;}
main{max-width:1100px;margin:0 auto;padding:0 16px 40px;display:flex;flex-direction:column;gap:20px;}
.tarjeta{background:var(--tarjeta);border:1px solid var(--borde);border-radius:16px;padding:20px;box-shadow:0 8px 24px rgba(0,0,0,.35);}
h2{margin:0 0 12px;font-size:22px;}
h3{margin:14px 0 6px;font-size:19px;color:var(--acento2);}
.centrado{text-align:center;}
.btn{display:inline-block;border:none;border-radius:12px;padding:12px 18px;font-size:17px;font-weight:600;color:#06281a;background:linear-gradient(135deg,var(--acento),#2bb673);cursor:pointer;text-decoration:none;}
.btn-gris{background:#2a3648;color:var(--texto);}
.btn-rojo{background:linear-gradient(135deg,#e05252,#c73e3e);color:#fff;}
.btn-verde{background:linear-gradient(135deg,var(--acento),#2bb673);color:#06281a;}
.btn:disabled{opacity:.45;cursor:not-allowed;}
.btn-mini{padding:6px 10px;font-size:14px;border-radius:8px;margin:2px 2px 2px 0;}
.fila{display:flex;gap:12px;flex-wrap:wrap;margin-top:12px;}
.suave{color:var(--suave);}
.codigo{background:#0d1526;border:1px solid var(--borde);border-radius:10px;padding:12px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:20px;letter-spacing:2px;margin-top:8px;word-break:break-all;}
.codigo-chico{font-size:14px !important;letter-spacing:0 !important;}
.badge{display:inline-block;padding:4px 10px;border-radius:999px;font-size:14px;margin-right:6px;vertical-align:middle;}
.badge-tipo{background:#123a5c;color:#9fd2ff;}
.badge-ok{background:#12402c;color:#7ee2ae;}
.badge-no{background:#4a1a1a;color:#ff9d9d;}
.badge-morado{background:#3a2350;color:#d3a6ff;}
.badge-premio{background:#5c3a12;color:#ffd39f;}
.badge-pool-dia{background:#3a2350;color:#d3a6ff;}
.badge-nota{background:#3a2350;color:#d3a6ff;font-size:13px;}
.badge-aviso{background:rgba(255,211,61,.18);color:var(--aviso);}
.badge-cerrado{background:rgba(31,162,255,.15);color:var(--acento2);}
.asig-linea{color:var(--suave);font-size:15px;margin:2px 0;}
.asig-linea b{color:var(--texto);}

.tabla-concursos{width:100%;border-collapse:collapse;margin-top:10px;font-size:14px;table-layout:fixed;}
.tabla-concursos th,.tabla-concursos td{border:1px solid var(--borde);padding:8px;text-align:left;vertical-align:top;word-wrap:break-word;}
.tabla-concursos th{background:#0e1728;color:var(--acento2);font-size:12px;font-weight:700;white-space:normal;line-height:1.25;}
.tabla-concursos th:nth-child(1),.tabla-concursos td:nth-child(1){width:20%;}
.tabla-concursos th:nth-child(2),.tabla-concursos td:nth-child(2){width:10%;}
.tabla-concursos th:nth-child(3),.tabla-concursos td:nth-child(3){width:10%;}
.tabla-concursos th:nth-child(4),.tabla-concursos td:nth-child(4){width:8%;}
.tabla-concursos th:nth-child(5),.tabla-concursos td:nth-child(5){width:22%;}
.tabla-concursos th:nth-child(6),.tabla-concursos td:nth-child(6){width:15%;}
.tabla-concursos th:nth-child(7),.tabla-concursos td:nth-child(7){width:15%;}
.tabla-concursos tbody tr:hover{background:rgba(31,162,255,.06);}
.tabla-concursos td.acciones{white-space:normal;line-height:1.7;padding-top:8px;padding-bottom:8px;}
.tabla-concursos td.estado-mini{font-size:12px;color:var(--suave);}

.modal-fondo{position:fixed;inset:0;background:rgba(4,8,16,.72);backdrop-filter:blur(2px);display:flex;align-items:center;justify-content:center;z-index:1000;padding:18px;animation:modalFade .15s ease;}
@keyframes modalFade{from{opacity:0}to{opacity:1}}
.modal-caja{background:var(--tarjeta);border:1px solid var(--borde);border-radius:16px;padding:22px;max-width:520px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.55);animation:modalPop .18s ease;}
.modal-caja-grande{max-width:760px;max-height:92vh;overflow-y:auto;}
@keyframes modalPop{from{transform:scale(.94);opacity:0}to{transform:scale(1);opacity:1}}
.modal-titulo{margin:0 0 12px;font-size:20px;color:var(--acento);}
.modal-seccion{margin-bottom:14px;padding-bottom:14px;border-bottom:1px dashed var(--borde);}
.modal-seccion:last-child{border-bottom:none;padding-bottom:0;}
.modal-seccion h4{margin:0 0 8px;font-size:16px;color:var(--acento2);font-weight:700;}
.modal-botones{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;margin-top:16px;}
.modal-botones .btn{min-width:110px;padding:11px 16px;}
.detalle-linea{margin:4px 0;font-size:15px;}
.detalle-linea b{color:var(--texto);}
/* ===== P0-04 fase 4b: clases que sustituyen a los style= de este HTML y de js/aliados-concursos.js ===== */
.fila-mt0{margin-top:0}
.mt-12{margin-top:12px}
.asig-mt6{margin-top:6px}
.asig-mt8{margin-top:8px}
.codigo-inline{margin:0;padding:4px 8px;display:inline-block}
.codigo-inline2{display:inline-block;margin:0;padding:4px 8px}
.rojo{color:var(--rojo)}
</style>
</head>
<body>
<div class="franja"></div>
<header class="cabecera">
  <div class="logo">🏆</div>
  <div>
    <div class="ceja">Concursos</div>
    <h1>NitroSystem</h1>
  </div>
</header>
<main>

  <div class="fila fila-mt0">
    <button class="btn btn-gris" id="btnVolverArriba">← Volver a aliados</button>
  </div>

  <section class="tarjeta" id="tarjetaAliado">
    <h2 class="centrado">🏆 Concursos del aliado</h2>
    <div id="contenedorInfoAsig" class="mt-12"><p class="suave">Cargando...</p></div>
  </section>

  <section class="tarjeta" id="tarjetaConcursos">
    <h2 class="centrado">📜 Historial completo de concursos</h2>
    <p class="suave centrado">Todos los concursos de esta asignación, incluso cerrados. Solo lectura por ahora.</p>
    <div id="contenedorConcursos" class="mt-12"><p class="suave">Consultando...</p></div>
  </section>

  <div class="fila">
    <button class="btn btn-gris" id="btnVolverAbajo">← Volver a aliados</button>
  </div>

</main>
<script src="js/aliados-concursos.js"></script>
</body>
</html>
