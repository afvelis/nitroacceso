<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nitrotoon Control de acceso</title>
<style>
:root{
  --fondo:#0b1220; --tarjeta:#121c2e; --borde:#24344d; --texto:#eef3f8;
  --suave:#9fb0c3; --acento:#35d07f; --acento2:#1fa2ff; --aviso:#ffd33d;
}
*{box-sizing:border-box;}
body{
  margin:0; background:var(--fondo); color:var(--texto);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  font-size:17px; line-height:1.5;
}
.franja{height:6px;background:linear-gradient(90deg,var(--acento),var(--acento2));}
.cabecera{display:flex;gap:14px;align-items:center;padding:20px 16px;max-width:860px;margin:0 auto;}
.logo{width:56px;height:56px;border-radius:14px;background:linear-gradient(135deg,var(--acento),var(--acento2));display:flex;align-items:center;justify-content:center;font-size:30px;flex:none;}
.ceja{color:var(--suave);letter-spacing:2px;text-transform:uppercase;font-size:17px;}
h1{margin:0;font-size:26px;}
h2{margin:0 0 12px;font-size:22px;}
main{max-width:860px;margin:0 auto;padding:0 16px 40px;display:flex;flex-direction:column;gap:20px;}
.tarjeta{background:var(--tarjeta);border:1px solid var(--borde);border-radius:16px;padding:20px;box-shadow:0 8px 24px rgba(0,0,0,.35);}
input{width:100%;padding:12px;border-radius:10px;border:1px solid var(--borde);background:#0d1526;color:var(--texto);font-size:17px;}
.btn{display:inline-block;border:none;border-radius:12px;padding:12px 18px;font-size:17px;font-weight:600;color:#06281a;background:linear-gradient(135deg,var(--acento),#2bb673);cursor:pointer;text-decoration:none;}
.btn-gris{background:#2a3648;color:var(--texto);}
.btn-rojo{background:linear-gradient(135deg,#e05252,#c73e3e);color:#fff;}
.fila{display:flex;gap:12px;flex-wrap:wrap;margin-top:12px;}
.suave{color:var(--suave);}
.badge{display:inline-block;padding:4px 10px;border-radius:999px;font-size:17px;margin-left:8px;vertical-align:middle;}
.badge-ok{background:#12402c;color:#7ee2ae;}
.badge-tipo{background:#123a5c;color:#9fd2ff;}
.badge-no{background:#4a1a1a;color:#ff9d9d;}
.filaPersona{display:grid;grid-template-columns:1fr 1fr 1fr 1fr auto;gap:8px;margin-top:8px;align-items:center;}
@media (max-width:700px){.filaPersona{grid-template-columns:1fr 1fr;}}
table{border-collapse:collapse;width:100%;margin:10px 0;}
th,td{border:1px solid var(--borde);padding:8px;font-size:17px;text-align:left;}
th{background:#0d1526;color:var(--suave);}
.qrbox{margin-top:14px;padding:14px;border:1px dashed var(--borde);border-radius:12px;text-align:center;}
.qrbox img{width:220px;height:220px;background:#fff;padding:8px;border-radius:10px;}
</style>
</head>
<body>
<div class="franja"></div>
<header class="cabecera">
  <div class="logo">🚀</div>
  <div>
    <div class="ceja">Registro de talento</div>
    <h1>Nitrotoon Control de acceso</h1>
  </div>
</header>
<main>

  <section class="tarjeta" id="cardCarga">
    <p class="suave">Cargando tu link...</p>
  </section>

  <section class="tarjeta" id="cardError" hidden>
    <h2>Link no valido</h2>
    <p id="msgError" class="suave"></p>
  </section>

  <section class="tarjeta" id="cardTalento" hidden>
    <h2 id="tituloTalento"></h2>
    <p id="notaEdicionTal" class="suave"></p>
    <p id="msgGlobal" class="suave"></p>
    <div id="zonaListas"></div>
  </section>

  <section class="tarjeta" id="cardPregunta" hidden>
    <h2>Se repiten los integrantes en el Dia 2?</h2>
    <p class="suave">Si la misma gente trabaja ambos dias, copiamos la lista del Dia 1 al Dia 2. Si no, dejaremos el Dia 2 vacio para que lo llenes aparte.</p>
    <div class="fila">
      <button class="btn" id="btnSiRepiten">Si, son los mismos</button>
      <button class="btn btn-gris" id="btnNoRepiten">No, lista nueva</button>
    </div>
  </section>

</main>
<script src="config.js"></script>
<script>
function $(id){ return document.getElementById(id); }
function esc(t){
  return String(t == null ? '' : t)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function avisoMsg(id, texto, ok){
  var el = $(id);
  el.textContent = texto;
  el.style.color = ok ? 'var(--acento)' : 'var(--aviso)';
}
function boton(texto, clase, fn){
  var b = document.createElement('button');
  b.className = 'btn ' + clase;
  b.textContent = texto;
  b.onclick = fn;
  return b;
}
function param(name){
  return new URLSearchParams(location.search).get(name);
}

var DATA = null;
var CODIGO = null;

function fallarLink(txt){
  $('cardCarga').hidden = true;
  $('cardError').hidden = false;
  $('msgError').textContent = txt;
}

async function cargar(){
  var t = param('t');
  if (!t) { fallarLink('Link incompleto: falta el codigo del talento. Pidele el link completo a tu coordinador.'); return; }
  try {
    var d = await llamar('f_link_talento_ver', { p_codigo_link: t });
    if (!d) { fallarLink('Este link no existe o fue revocado. Pidele uno nuevo a tu coordinador.'); return; }
    DATA = d;
    CODIGO = t;
    render();
  } catch (e) {
    fallarLink('No se pudo conectar con la base de datos: ' + e.message);
  }
}

function nombreTalento(){
  if (typeof DATA.talento === 'string') return DATA.talento;
  if (DATA.talento && DATA.talento.nombre) return DATA.talento.nombre;
  return 'Talento';
}

function render(){
  $('cardCarga').hidden = true;
  $('cardTalento').hidden = false;
  $('tituloTalento').textContent = nombreTalento();
  if (DATA.edicion_abierta) {
    avisoMsg('notaEdicionTal', 'La edicion esta ABIERTA: puedes guardar cambios mientras cada lista no pase a puerta.', true);
  } else {
    avisoMsg('notaEdicionTal', 'El administrador CERRo la edicion: estas viendo solo consulta.', false);
  }
  avisoMsg('msgGlobal', '', true);
  var zona = $('zonaListas');
  zona.innerHTML = '';
  var listas = (DATA.listas || []).slice().sort(function(a, b){ return a.dia - b.dia; });
  listas.forEach(function(l){ zona.appendChild(cardLista(l)); });
  actualizarPregunta(listas);
}

function cardLista(l){
  var sec = document.createElement('section');
  sec.className = 'tarjeta';
  var estadoTxt = (l.estado === 'en_edicion') ? 'En edicion' : ((l.estado === 'en_puerta') ? 'En puerta' : 'Cerrada');
  var badgeCls = (l.estado === 'en_edicion') ? 'badge-ok' : ((l.estado === 'en_puerta') ? 'badge-tipo' : 'badge-no');
  sec.innerHTML = '<h2>Dia ' + l.dia + ' <span class="badge ' + badgeCls + '">' + estadoTxt + '</span></h2>';
  var editable = DATA.edicion_abierta && l.estado === 'en_edicion';
  if (editable) {
    var hint = document.createElement('p');
    hint.className = 'suave';
    hint.textContent = 'Pulsa "Agregar participante" para anadir integrantes y luego "Guardar lista". Nombre, apellido, cedula y cargo son obligatorios.';
    sec.appendChild(hint);
    var rows = document.createElement('div');
    rows.id = 'rows-' + l.dia;
    (l.personas || []).forEach(function(p){ rows.appendChild(filaPersona(p)); });
    sec.appendChild(rows);
    var fila = document.createElement('div');
    fila.className = 'fila';
    fila.appendChild(boton('Agregar participante', 'btn-gris', function(){ rows.appendChild(filaPersona(null)); }));
    fila.appendChild(boton('Guardar lista del Dia ' + l.dia, '', function(){ guardarDia(l, rows); }));
    sec.appendChild(fila);
  } else {
    var nota = document.createElement('p');
    nota.className = 'suave';
    nota.textContent = DATA.edicion_abierta
      ? 'Esta lista ya esta en puerta o cerrada: no se puede editar, solo consultar.'
      : 'La edicion esta cerrada: esta lista es solo de consulta.';
    sec.appendChild(nota);
    sec.appendChild(tablaPersonas(l.personas));
  }
  if ((l.personas || []).length && l.codigo_corto) {
    var qr = document.createElement('div');
    qr.className = 'qrbox';
    var qrInner = document.createElement('div');
    qr.appendChild(qrInner);
    var notaQr = document.createElement('p');
    notaQr.className = 'suave';
    notaQr.textContent = 'Muestra este QR en la puerta, o dicta el codigo corto si el QR no se pudiera leer.';
    qr.appendChild(notaQr);
    sec.appendChild(qr);
    ponerQR(qrInner, urlPuerta('lista', l.codigo_corto), l.codigo_corto);
  } else if (editable) {
    var notaQr2 = document.createElement('p');
    notaQr2.className = 'suave';
    notaQr2.textContent = 'El QR de esta lista aparecera aqui cuando guardes al menos un participante con todos sus datos.';
    sec.appendChild(notaQr2);
  }
  return sec;
}

function filaPersona(p){
  var div = document.createElement('div');
  div.className = 'filaPersona';
  var campos = [
    ['nombre', 'Nombre'],
    ['apellido', 'Apellido'],
    ['cedula', 'Cedula'],
    ['cargo', 'Cargo']
  ];
  campos.forEach(function(c){
    var inp = document.createElement('input');
    inp.placeholder = c[1];
    inp.value = (p && p[c[0]]) ? p[c[0]] : '';
    div.appendChild(inp);
  });
  var b = boton('Quitar', 'btn-rojo', function(){ div.remove(); });
  div.appendChild(b);
  return div;
}

function tablaPersonas(rows){
  var t = document.createElement('table');
  t.innerHTML = '<tr><th>Nombre</th><th>Apellido</th><th>Cedula</th><th>Cargo</th><th>Estado</th></tr>';
  (rows || []).forEach(function(p){
    var tr = document.createElement('tr');
    tr.innerHTML = '<td>' + esc(p.nombre) + '</td><td>' + esc(p.apellido) + '</td><td>' + esc(p.cedula) + '</td><td>' + esc(p.cargo) + '</td><td>' + esc(p.estado) + '</td>';
    t.appendChild(tr);
  });
  if (!(rows || []).length) {
    var tr2 = document.createElement('tr');
    tr2.innerHTML = '<td colspan="5">Sin personas registradas.</td>';
    t.appendChild(tr2);
  }
  return t;
}

async function guardarDia(l, rows){
  var filas = rows.querySelectorAll('.filaPersona');
  var arr = [];
  for (var i = 0; i < filas.length; i++) {
    var inputs = filas[i].querySelectorAll('input');
    var p = {
      nombre: inputs[0].value.trim(),
      apellido: inputs[1].value.trim(),
      cedula: inputs[2].value.trim(),
      cargo: inputs[3].value.trim()
    };
    if (!p.nombre && !p.apellido && !p.cedula && !p.cargo) continue;
    if (!p.nombre || !p.apellido || !p.cedula || !p.cargo) {
      avisoMsg('msgGlobal', 'Hay una fila con campos vacios en la lista del Dia ' + l.dia + '. Completa esa fila o pulsale Quitar.', false);
      return;
    }
    arr.push(p);
  }
  if (!arr.length) {
    if (!confirm('Esto dejara VACIA la lista del Dia ' + l.dia + '. Continuar?')) return;
  }
  try {
    var ok = await llamar('f_link_talento_guardar', {
      p_codigo_link: CODIGO, p_dia: l.dia, p_personas: arr
    });
    if (ok === true) {
      avisoMsg('msgGlobal', 'Lista del Dia ' + l.dia + ' guardada.', true);
      await cargar();
      return;
    }
    avisoMsg('msgGlobal', 'No se pudo guardar la lista. Revisa que la edicion este abierta y que ningun campo quede vacio.', false);
  } catch (e) {
    if (String(e.message).indexOf('duplicate') >= 0 || String(e.message).indexOf('unique') >= 0) {
      avisoMsg('msgGlobal', 'Hay cedulas repetidas dentro de la lista del Dia ' + l.dia + '. Cada participante debe tener una cedula distinta.', false);
      return;
    }
    avisoMsg('msgGlobal', 'No se pudo conectar: ' + e.message, false);
  }
}

function actualizarPregunta(listas){
  var l1 = null, l2 = null;
  listas.forEach(function(l){ if (l.dia === 1) l1 = l; if (l.dia === 2) l2 = l; });
  var show = !!(l1 && l2 && DATA.edicion_abierta
    && l1.estado === 'en_edicion' && l2.estado === 'en_edicion'
    && (l1.personas || []).length > 0 && (l2.personas || []).length === 0
    && !sessionStorage.getItem('na_norep_' + CODIGO));
  $('cardPregunta').hidden = !show;
}

async function copiarDia(){
  try {
    var ok = await llamar('f_link_talento_copiar', {
      p_codigo_link: CODIGO, p_dia_origen: 1, p_dia_destino: 2
    });
    if (ok === true) {
      await cargar();
      return;
    }
    avisoMsg('msgGlobal', 'No se pudo copiar la lista al Dia 2 (quizas el Dia 2 ya tiene integrantes).', false);
  } catch (e) {
    avisoMsg('msgGlobal', 'No se pudo conectar: ' + e.message, false);
  }
}

$('btnSiRepiten').onclick = copiarDia;
$('btnNoRepiten').onclick = function(){
  sessionStorage.setItem('na_norep_' + CODIGO, '1');
  $('cardPregunta').hidden = true;
};

cargar();
</script>
</body>
</html>
