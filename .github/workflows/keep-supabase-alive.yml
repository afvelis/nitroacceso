name: Keep Supabase Alive

on:
  schedule:
    # Se ejecuta cada 3 días a las 12:00 UTC (08:00 en Venezuela)
    - cron: '0 12 */3 * *'
  workflow_dispatch: # Permite ejecutarlo manualmente para probar

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase via RPC
        run: |
          curl -X POST "${{ secrets.SUPABASE_URL }}/rest/v1/rpc/f_cortesia_ver" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{"p_codigo_link":"keepalive-ping"}' \
            --fail --silent --show-error
          echo "✅ Supabase despierto y activo"
