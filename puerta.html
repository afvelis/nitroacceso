<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nitrotoon Control de acceso - Puerta</title>
<script src="config.js"></script>
<style>
:root{
  --fondo:#0b1220;
  --tarjeta:#121c2e;
  --borde:#24344d;
  --texto:#eef3f8;
  --suave:#9fb0c3;
  --acento:#35d07f;
  --acento2:#1fa2ff;
  --aviso:#ffd33d;
  --rojo:#e05252;
  --rojo2:#c73e3e;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
  background:var(--fondo);
  color:var(--texto);
  font-size:17px;
  line-height:1.5;
  min-height:100vh;
  padding-bottom:40px;
}
.franja{height:6px;background:linear-gradient(90deg,var(--acento),var(--acento2));width:100%}
.cabecera{
  display:flex;align-items:center;gap:14px;
  padding:18px 20px;
  background:var(--tarjeta);
  border-bottom:1px solid var(--borde);
}
.logo{
  font-size:28px;
  background:linear-gradient(135deg,var(--acento),var(--acento2));
  width:48px;height:48px;
  display:flex;align-items:center;justify-content:center;
  border-radius:10px;
}
.titulo{font-size:20px;font-weight:700}
.subtitulo{font-size:14px;color:var(--suave)}
.contenedor{max-width:900px;margin:20px auto;padding:0 16px}
.tarjeta{
  background:var(--tarjeta);
  border:1px solid var(--borde);
  border-radius:16px;
  padding:20px;
  margin-bottom:18px;
  box-shadow:0 4px 14px rgba(0,0,0,.25);
}
.tarjeta h2{font-size:19px;margin-bottom:12px;color:var(--acento)}
.aviso{
  padding:12px 14px;border-radius:10px;
  background:rgba(255,211,61,.12);
  border:1px solid var(--aviso);
  color:var(--aviso);
  margin-bottom:14px;
  font-size:15px;
}
.btn{
  display:inline-block;
  padding:12px 20px;
  border:none;border-radius:10px;
  font-size:17px;font-weight:600;
  cursor:pointer;
  text-decoration:none;
  color:white;
  background:linear-gradient(135deg,var(--acento),#26a866);
  transition:transform .1s;
}
.btn:active{transform:scale(.97)}
.btn-gris{background:#2a3648;color:var(--texto)}
.btn-rojo{background:linear-gradient(135deg,var(--rojo),var(--rojo2))}
.btn-azul{background:linear-gradient(135deg,var(--acento2),#147acc)}
input,select{
  width:100%;
  padding:12px 14px;
  border:1px solid var(--borde);
  border-radius:10px;
  background:#0d1626;
  color:var(--texto);
  font-size:17px;
  font-family:inherit;
}
input:focus,select:focus{outline:2px solid var(--acento2);border-color:var(--acento2)}
label{display:block;margin-bottom:6px;color:var(--suave);font-size:15px}
.fila{display:flex;gap:10px;flex-wrap:wrap}
.fila > *{flex:1;min-width:120px}
.pill{
  display:inline-block;
  padding:4px 10px;
  border-radius:20px;
  font-size:13px;
  font-weight:600;
}
.pill-verde{background:rgba(53,208,127,.18);color:var(--acento)}
.pill-amarillo{background:rgba(255,211,61,.18);color:var(--aviso)}
.pill-azul{background:rgba(31,162,255,.18);color:var(--acento2)}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace;letter-spacing:1px}
.selector-dia{
  display:flex;gap:10px;margin-bottom:16px;
}
.selector-dia button{
  flex:1;padding:14px;border:2px solid var(--borde);
  background:#0d1626;color:var(--suave);
  border-radius:10px;cursor:pointer;font-size:17px;font-weight:600;
  transition:all .2s;
}
.selector-dia button:hover{
  border-color:var(--acento);
}
.selector-dia button.activo{
  background:linear-gradient(135deg,var(--acento),#26a866);
  border-color:var(--acento);
  color:white;
}
.modo-tabs{
  display:flex;gap:8px;margin-bottom:16px;
}
.modo-tabs button{
  flex:1;padding:10px;border:1px solid var(--borde);
  background:transparent;color:var(--suave);
  border-radius:8px;cursor:pointer;font-size:15px;
}
.modo-tabs button.activo{
  background:var(--borde);color:var(--texto);
}
#visorQR{
  width:100%;
  max-width:500px;
  aspect-ratio:4/3;
  background:#000;
  border-radius:12px;
  margin:14px auto;
  display:block;
  border:2px solid var(--acento);
}
.scan-line{
  position:relative;
}
</style>
</head>
<body>
<div class="franja"></div>
<header class="cabecera">
  <div class="logo">🚀</div>
  <div>
    <div class="titulo">Nitrotoon Control de acceso</div>
    <div class="subtitulo">Puerta de entrada</div>
  </div>
</header>

<main class="contenedor">
  <div class="tarjeta" id="tarjetaLogin">
    <h2>🔐 Sesión de puerta</h2>
    <p style="color:var(--suave);margin-bottom:14px">Ingresa el PIN de puerta para comenzar.</p>
    <label for="pin">PIN de puerta</label>
    <input type="password" id="pin" inputmode="numeric" maxlength="6" placeholder="••••">
    <div style="margin-top:14px">
      <button class="btn" id="btnEntrar">Entrar</button>
    </div>
  </div>

  <div class="tarjeta" id="tarjetaPrincipal" style="display:none">
    <h2>🎯 Control de acceso</h2>
    
    <label>Selecciona el día (solo uno activo a la vez)</label>
    <div class="selector-dia">
      <button id="btnDia1">📅 Día 1</button>
      <button id="btnDia2">📅 Día 2</button>
    </div>

    <div id="panelDia" style="display:none">
      <div class="aviso" id="avisoDia"></div>

      <div class="modo-tabs">
        <button class="activo" id="tabLista">📋 Lista de talento</button>
        <button id="tabVendedor">👤 Vendedor de stand</button>
      </div>

      <div id="panelLista">
        <label for="codigoLista">Código corto de lista (L-XXXXXX) o nombre</label>
        <input type="text" id="codigoLista" placeholder="Ej: L-43B2CD o nombre del talento">
        <div style="margin-top:12px;display:flex;gap:8px;flex-wrap:wrap">
          <button class="btn" id="btnBuscarLista">Buscar lista</button>
          <button class="btn btn-azul" id="btnEscanearLista">📷 Escanear QR</button>
        </div>
      </div>

      <div id="panelVendedor" style="display:none">
        <label for="codigoVendedor">Código QR del vendedor (V-XXXXXXXX) o cédula</label>
        <input type="text" id="codigoVendedor" placeholder="Ej: V-A1B2C3D4 o 12345678">
        <div style="margin-top:12px;display:flex;gap:8px;flex-wrap:wrap">
          <button class="btn" id="btnBuscarVendedor">Buscar vendedor</button>
          <button class="btn btn-azul" id="btnEscanearVendedor">📷 Escanear QR</button>
        </div>
      </div>

      <div id="visorContainer" style="display:none;margin-top:16px">
        <video id="visorQR" autoplay playsinline muted></video>
        <p style="text-align:center;color:var(--suave);font-size:14px">Apunta la cámara al código QR</p>
        <button class="btn btn-rojo" id="btnDetenerScan" style="display:block;margin:10px auto">⏹ Detener cámara</button>
      </div>
    </div>

    <div style="margin-top:20px">
      <button class="btn btn-gris" id="btnSalir">🚪 Cerrar sesión</button>
    </div>
  </div>
</main>

<script>
const elPin = document.getElementById('pin');
const btnEntrar = document.getElementById('btnEntrar');
const tarjetaLogin = document.getElementById('tarjetaLogin');
const tarjetaPrincipal = document.getElementById('tarjetaPrincipal');
const btnDia1 = document.getElementById('btnDia1');
const btnDia2 = document.getElementById('btnDia2');
const panelDia = document.getElementById('panelDia');
const avisoDia = document.getElementById('avisoDia');
const tabLista = document.getElementById('tabLista');
const tabVendedor = document.getElementById('tabVendedor');
const panelLista = document.getElementById('panelLista');
const panelVendedor = document.getElementById('panelVendedor');
const codigoLista = document.getElementById('codigoLista');
const codigoVendedor = document.getElementById('codigoVendedor');
const btnBuscarLista = document.getElementById('btnBuscarLista');
const btnBuscarVendedor = document.getElementById('btnBuscarVendedor');
const btnEscanearLista = document.getElementById('btnEscanearLista');
const btnEscanearVendedor = document.getElementById('btnEscanearVendedor');
const visorContainer = document.getElementById('visorContainer');
const visorQR = document.getElementById('visorQR');
const btnDetenerScan = document.getElementById('btnDetenerScan');
const btnSalir = document.getElementById('btnSalir');

let diaSeleccionado = null;
let tokenSesion = null;
let streamVideo = null;
let detectorQR = null;
let scanningInterval = null;
let modoScanActual = null; // 'lista' o 'vendedor'

function mostrarPrincipal(){
  tarjetaLogin.style.display = 'none';
  tarjetaPrincipal.style.display = 'block';
}

function seleccionarDia(dia){
  diaSeleccionado = dia;
  // Exclusividad visual: solo uno activo
  if(dia === 1){
    btnDia1.classList.add('activo');
    btnDia2.classList.remove('activo');
  }else{
    btnDia2.classList.add('activo');
    btnDia1.classList.remove('activo');
  }
  panelDia.style.display = 'block';
  avisoDia.textContent = `✓ Controlando entrada del Día ${dia}`;
}

btnDia1.addEventListener('click', () => seleccionarDia(1));
btnDia2.addEventListener('click', () => seleccionarDia(2));

tabLista.addEventListener('click', () => {
  tabLista.classList.add('activo');
  tabVendedor.classList.remove('activo');
  panelLista.style.display = 'block';
  panelVendedor.style.display = 'none';
});

tabVendedor.addEventListener('click', () => {
  tabVendedor.classList.add('activo');
  tabLista.classList.remove('activo');
  panelVendedor.style.display = 'block';
  panelLista.style.display = 'none';
});

btnEntrar.addEventListener('click', async () => {
  const pin = elPin.value.trim();
  if(!pin){ alert('Escribe el PIN de puerta.'); return; }
  btnEntrar.disabled = true;
  btnEntrar.textContent = 'Entrando...';
  try{
    const r = await llamar('f_login', { p_pin: pin });
    if(!r || r.length === 0 || r[0].rol !== 'puerta'){
      alert('PIN incorrecto o no es de puerta.');
      btnEntrar.disabled = false;
      btnEntrar.textContent = 'Entrar';
      return;
    }
    guardarSesion(r[0].token, r[0].rol);
    tokenSesion = r[0].token;
    mostrarPrincipal();
  }catch(e){
    alert('Error al entrar: ' + (e.message || e));
  }
  btnEntrar.disabled = false;
  btnEntrar.textContent = 'Entrar';
});

btnSalir.addEventListener('click', () => {
  if(confirm('¿Cerrar sesión de puerta?')){
    detenerScanner();
    borrarSesion();
    location.reload();
  }
});

btnBuscarLista.addEventListener('click', async () => {
  if(!diaSeleccionado){ alert('Selecciona un día primero.'); return; }
  const buscar = codigoLista.value.trim();
  if(!buscar){ alert('Escribe un código o nombre.'); return; }
  btnBuscarLista.disabled = true;
  btnBuscarLista.textContent = 'Buscando...';
  try{
    const listas = await llamar('f_puerta_lista', {
      p_token: tokenSesion,
      p_dia: diaSeleccionado,
      p_buscar: buscar
    });
    if(!listas || listas.length === 0){
      alert('No se encontraron listas.');
    }else{
      alert(`Se encontraron ${listas.length} lista(s). Siguiente paso: mostrar resultados.`);
    }
  }catch(e){
    alert('Error: ' + (e.message || e));
  }
  btnBuscarLista.disabled = false;
  btnBuscarLista.textContent = 'Buscar lista';
});

btnBuscarVendedor.addEventListener('click', async () => {
  if(!diaSeleccionado){ alert('Selecciona un día primero.'); return; }
  const codigo = codigoVendedor.value.trim();
  if(!codigo){ alert('Escribe un código o cédula.'); return; }
  btnBuscarVendedor.disabled = true;
  btnBuscarVendedor.textContent = 'Buscando...';
  try{
    let vendedor = null;
    if(codigo.toUpperCase().startsWith('V-')){
      vendedor = await llamar('f_puerta_vendedor_por_qr', {
        p_token: tokenSesion,
        p_codigo_qr: codigo
      });
    }else{
      vendedor = await llamar('f_puerta_vendedor_por_cedula', {
        p_token: tokenSesion,
        p_cedula: codigo
      });
    }
    if(!vendedor){
      alert('No se encontró el vendedor.');
    }else{
      alert(`Vendedor encontrado: ${vendedor.nombre} ${vendedor.apellido}. Siguiente paso: mostrar detalles.`);
    }
  }catch(e){
    alert('Error: ' + (e.message || e));
  }
  btnBuscarVendedor.disabled = false;
  btnBuscarVendedor.textContent = 'Buscar vendedor';
});

// === LECTOR DE QR CON CÁMARA (API nativa BarcodeDetector) ===
async function iniciarScanner(modo){
  if(!('BarcodeDetector' in window)){
    alert('Tu navegador no soporta lectura de QR por cámara. Escribe el código manualmente.');
    return;
  }
  if(!diaSeleccionado){
    alert('Selecciona un día primero.');
    return;
  }
  
  modoScanActual = modo;
  try{
    streamVideo = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'environment', width: { ideal: 1280 }, height: { ideal: 720 } }
    });
    visorQR.srcObject = streamVideo;
    visorContainer.style.display = 'block';
    
    detectorQR = new BarcodeDetector({ formats: ['qr_code'] });
    
    scanningInterval = setInterval(async () => {
      if(!visorQR.videoWidth) return;
      try{
        const codigos = await detectorQR.detect(visorQR);
        if(codigos && codigos.length > 0){
          const valor = codigos[0].rawValue;
          procesarQRLeido(valor);
        }
      }catch(e){
        // Silenciar errores de detección
      }
    }, 300);
  }catch(e){
    alert('No se pudo acceder a la cámara: ' + e.message);
  }
}

function detenerScanner(){
  if(scanningInterval){
    clearInterval(scanningInterval);
    scanningInterval = null;
  }
  if(streamVideo){
    streamVideo.getTracks().forEach(t => t.stop());
    streamVideo = null;
  }
  visorContainer.style.display = 'none';
}

function procesarQRLeido(valor){
  detenerScanner();
  // El QR codifica una URL como https://afvelis.github.io/nitroacceso/puerta.html?lista=L-XXXXX o ?v=V-XXXXX
  try{
    const url = new URL(valor);
    const params = url.searchParams;
    if(params.has('lista')){
      codigoLista.value = params.get('lista');
      tabLista.click();
      btnBuscarLista.click();
    }else if(params.has('v')){
      codigoVendedor.value = params.get('v');
      tabVendedor.click();
      btnBuscarVendedor.click();
    }else{
      alert('QR leído pero no contiene datos de lista ni vendedor: ' + valor);
    }
  }catch(e){
    // Si no es URL válida, intentar usar el valor directo
    if(valor.toUpperCase().startsWith('V-')){
      codigoVendedor.value = valor;
      tabVendedor.click();
      btnBuscarVendedor.click();
    }else if(valor.toUpperCase().startsWith('L-')){
      codigoLista.value = valor;
      tabLista.click();
      btnBuscarLista.click();
    }else{
      alert('QR leído: ' + valor + '\nNo se reconoce el formato.');
    }
  }
}

btnEscanearLista.addEventListener('click', () => iniciarScanner('lista'));
btnEscanearVendedor.addEventListener('click', () => iniciarScanner('vendedor'));
btnDetenerScan.addEventListener('click', detenerScanner);

// Al cargar: verificar sesión existente y parámetros URL
(function(){
  const s = leerSesion();
  if(s && s.rol === 'puerta'){
    tokenSesion = s.token;
    mostrarPrincipal();
  }
  
  const params = new URLSearchParams(location.search);
  const listaParam = params.get('lista');
  const vendedorParam = params.get('v');
  
  if(listaParam){
    codigoLista.value = listaParam;
    if(tokenSesion) seleccionarDia(1);
  }
  if(vendedorParam){
    codigoVendedor.value = vendedorParam;
    tabVendedor.click();
    if(tokenSesion) seleccionarDia(1);
  }
})();
</script>
</body>
</html>
