<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nitrotoon Control de acceso</title>
<script src="config.js"></script>
<style>
:root{
  --fondo:#0b1220;--tarjeta:#121c2e;--borde:#24344d;--texto:#eef3f8;
  --suave:#9fb0c3;--acento:#35d07f;--acento2:#1fa2ff;--aviso:#ffd33d;
  --rojo:#e05252;--rojo2:#c73e3e;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:var(--fondo);color:var(--texto);font-size:17px;line-height:1.5;min-height:100vh;display:flex;flex-direction:column}
.franja{height:6px;background:linear-gradient(90deg,var(--acento),var(--acento2))}
.cabecera{display:flex;align-items:center;gap:14px;padding:18px 20px;background:var(--tarjeta);border-bottom:1px solid var(--borde)}
.logo{font-size:28px;background:linear-gradient(135deg,var(--acento),var(--acento2));width:48px;height:48px;display:flex;align-items:center;justify-content:center;border-radius:10px}
.titulo{font-size:20px;font-weight:700}
.subtitulo{font-size:14px;color:var(--suave)}
.contenedor{flex:1;display:flex;align-items:center;justify-content:center;padding:20px}
.tarjeta{background:var(--tarjeta);border:1px solid var(--borde);border-radius:16px;padding:30px;width:100%;max-width:420px;box-shadow:0 4px 14px rgba(0,0,0,.25);text-align:center}
.tarjeta h2{font-size:20px;margin-bottom:18px;color:var(--acento)}
input{width:100%;padding:14px;border:1px solid var(--borde);border-radius:10px;background:#0d1626;color:var(--texto);font-size:20px;text-align:center;letter-spacing:4px;font-family:inherit}
input:focus{outline:2px solid var(--acento2);border-color:var(--acento2)}
.btn{width:100%;padding:14px;border:none;border-radius:10px;font-size:18px;font-weight:700;cursor:pointer;color:white;background:linear-gradient(135deg,var(--acento),#26a866);margin-top:16px;transition:transform .1s}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.aviso-error{margin-top:14px;padding:10px;border-radius:8px;background:rgba(224,82,82,.12);border:1px solid var(--rojo);color:var(--rojo);font-size:15px;display:none}
</style>
</head>
<body>
<div class="franja"></div>
<header class="cabecera">
  <div class="logo">🚀</div>
  <div>
    <div class="titulo">Nitrotoon Control de acceso</div>
    <div class="subtitulo">Sistema de control de acceso</div>
  </div>
</header>

<main class="contenedor">
  <div class="tarjeta">
    <h2>🔐 Ingreso al sistema</h2>
    <label for="pin" style="display:block;margin-bottom:10px;color:var(--suave);font-size:15px">Escribe tu PIN</label>
    <input type="password" id="pin" inputmode="numeric" maxlength="6" placeholder="••••" autocomplete="off">
    <button class="btn" id="btnEntrar">Entrar</button>
    <div class="aviso-error" id="msgError"></div>
  </div>
</main>

<script>
const elPin = document.getElementById('pin');
const btnEntrar = document.getElementById('btnEntrar');
const msgError = document.getElementById('msgError');

function redirigirPorRol(rol){
  if(rol === 'admin'){
    location.href = 'dashboard.html';
  }else if(rol === 'puerta'){
    location.href = 'puerta.html';
  }
}

// Si ya hay sesión activa, redirigir directamente
(function(){
  const s = leerSesion();
  if(s && s.token && s.rol){
    redirigirPorRol(s.rol);
  }
})();

btnEntrar.addEventListener('click', async () => {
  const pin = elPin.value.trim();
  if(!pin){
    msgError.textContent = 'Escribe un PIN.';
    msgError.style.display = 'block';
    return;
  }
  
  btnEntrar.disabled = true;
  btnEntrar.textContent = 'Entrando...';
  msgError.style.display = 'none';
  
  try{
    const r = await llamar('f_login', { p_pin: pin });
    if(!r || r.length === 0){
      msgError.textContent = 'PIN incorrecto.';
      msgError.style.display = 'block';
      btnEntrar.disabled = false;
      btnEntrar.textContent = 'Entrar';
      return;
    }
    
    guardarSesion(r[0].token, r[0].rol);
    redirigirPorRol(r[0].rol);
  }catch(e){
    msgError.textContent = 'Error al entrar: ' + (e.message || e);
    msgError.style.display = 'block';
    btnEntrar.disabled = false;
    btnEntrar.textContent = 'Entrar';
  }
});

elPin.addEventListener('keydown', (e) => {
  if(e.key === 'Enter'){
    btnEntrar.click();
  }
});
</script>
</body>
</html>
