<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NITROACCESO</title>
<style>
  body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; font-size: 18px; background: #101418; color: #f2f5f7; margin: 0; padding: 24px; }
  .caja { max-width: 560px; margin: 40px auto; background: #1c242b; border: 2px solid #3d4c59; border-radius: 12px; padding: 28px; }
  h1 { font-size: 30px; margin: 0 0 8px; }
  p { line-height: 1.5; }
  label { display: block; margin: 18px 0 6px; font-weight: 600; }
  input { width: 100%; box-sizing: border-box; font-size: 20px; padding: 12px; border-radius: 8px; border: 2px solid #3d4c59; background: #0d1115; color: #f2f5f7; }
  button { margin-top: 18px; width: 100%; font-size: 20px; font-weight: 700; padding: 14px; border-radius: 8px; border: none; background: #2ea043; color: #ffffff; cursor: pointer; }
  button:hover { background: #278a3a; }
  .aviso { color: #ffd33d; min-height: 24px; margin-top: 12px; font-weight: 600; }
  .nota { font-size: 17px; color: #b7c4cf; }
</style>
</head>
<body>
  <div class="caja">
    <h1 id="titulo">Control de acceso</h1>
    <p class="nota">Los enlaces de registro de talentos y stands llegan por WhatsApp o correo. Esta entrada es solo para personal autorizado.</p>
    <label for="pin">PIN de personal</label>
    <input id="pin" type="password" inputmode="numeric" autocomplete="off" placeholder="Escribe tu PIN">
    <button id="botonEntrar">Entrar</button>
    <p class="aviso" id="aviso"></p>
  </div>
<script src="config.js"></script>
<script>
  document.getElementById("titulo").textContent = NOMBRE_EVENTO + " - Control de acceso";
  document.getElementById("botonEntrar").addEventListener("click", async function () {
    const pin = document.getElementById("pin").value.trim();
    const aviso = document.getElementById("aviso");
    aviso.textContent = "";
    if (pin === "") { aviso.textContent = "Escribe tu PIN para continuar."; return; }
    try {
      const filas = await llamar("f_login", { p_pin: pin });
      if (!filas || filas.length === 0) { aviso.textContent = "PIN incorrecto. Intenta de nuevo."; return; }
      guardarSesion(filas[0].token, filas[0].rol);
      if (filas[0].rol === "admin") { window.location.href = "admin.html"; }
      else { window.location.href = "puerta.html"; }
    } catch (e) {
      aviso.textContent = "No se pudo conectar con la base de datos. Revisa tu internet y vuelve a intentar.";
    }
  });
</script>
</body>
</html>
