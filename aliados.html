<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NitroSystem</title>
<style>html,body{background:#0b1220;margin:0;}</style>
<script src="config.js"></script>
<script>
  // M-28: chequeo de sesión ANTES de pintar el body (evita destello).
  (function(){
    var s = leerSesion();
    if (!s || s.rol !== 'admin'){
      location.replace('acceso-denegado.html');
    }
  })();
</script>
<style>
:root{
  --fondo:#0b1220; --tarjeta:#121c2e; --borde:#24344d; --texto:#eef3f8;
  --suave:#9fb0c3; --acento:#35d07f; --acento2:#1fa2ff; --aviso:#ffd33d;
  --rojo:#e05252;
}
*{box-sizing:border-box;}
body{margin:0; background:var(--fondo); color:var(--texto); font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; font-size:17px; line-height:1.5;}
.franja{height:6px;background:linear-gradient(90deg,var(--acento),var(--acento2));}
.cabecera{display:flex;gap:14px;align-items:center;padding:20px 16px;max-width:1000px;margin:0 auto;}
.logo{width:56px;height:56px;border-radius:14px;background:linear-gradient(135deg,var(--acento),var(--acento2));display:flex;align-items:center;justify-content:center;font-size:30px;flex:none;}
.ceja{color:var(--suave);letter-spacing:2px;text-transform:uppercase;font-size:17px;}
h1{margin:0;font-size:26px;}
main{max-width:1000px;margin:0 auto;padding:0 16px 40px;display:flex;flex-direction:column;gap:20px;}
.tarjeta{background:var(--tarjeta);border:1px solid var(--borde);border-radius:16px;padding:20px;box-shadow:0 8px 24px rgba(0,0,0,.35);}
h2{margin:0 0 12px;font-size:22px;}
h3{margin:14px 0 6px;font-size:19px;color:var(--acento2);}
label{display:block;margin:10px 0;font-size:17px;}
select,input{width:100%;margin-top:6px;padding:12px;border-radius:10px;border:1px solid var(--borde);background:#0d1526;color:var(--texto);font-size:17px;}
input[type=checkbox]{width:auto;margin:0 8px 0 0;transform:scale(1.3);cursor:pointer;}
.centrado{text-align:center;}
.btn{display:inline-block;border:none;border-radius:12px;padding:12px 18px;font-size:17px;font-weight:600;color:#06281a;background:linear-gradient(135deg,var(--acento),#2bb673);cursor:pointer;text-decoration:none;}
.btn-gris{background:#2a3648;color:var(--texto);}
.btn-rojo{background:linear-gradient(135deg,#e05252,#c73e3e);color:#fff;}
.btn-verde{background:linear-gradient(135deg,var(--acento),#2bb673);color:#06281a;}
.btn:disabled{opacity:.45;cursor:not-allowed;}
.btn-mini{padding:6px 10px;font-size:14px;border-radius:8px;margin:2px 2px 2px 0;}
.fila{display:flex;gap:12px;flex-wrap:wrap;margin-top:12px;}
.suave{color:var(--suave);}
.codigo{background:#0d1526;border:1px solid var(--borde);border-radius:10px;padding:12px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:20px;letter-spacing:2px;margin-top:8px;word-break:break-all;}
.codigo-chico{font-size:14px !important;letter-spacing:0 !important;}
.badge{display:inline-block;padding:4px 10px;border-radius:999px;font-size:14px;margin-right:6px;vertical-align:middle;}
.badge-tipo{background:#123a5c;color:#9fd2ff;}
.badge-ok{background:#12402c;color:#7ee2ae;}
.badge-no{background:#4a1a1a;color:#ff9d9d;}
.badge-morado{background:#3a2350;color:#d3a6ff;}
.badge-premio{background:#5c3a12;color:#ffd39f;}
.badge-pool-dia{background:#3a2350;color:#d3a6ff;}
.badge-nota{background:#3a2350;color:#d3a6ff;font-size:13px;}
.nota-info{background:rgba(31,162,255,.10);border:1px solid var(--acento2);border-radius:10px;padding:12px 14px;margin-top:14px;font-size:15px;color:var(--texto);line-height:1.5;}
.aviso-rojo-box{background:rgba(224,82,82,.12);border:1px solid var(--rojo);color:var(--rojo);border-radius:10px;padding:12px 14px;margin-top:14px;font-size:15px;line-height:1.5;}
.nota-form{font-size:14px;color:var(--suave);margin-top:8px;}
.dup-item{background:#0e1728;border:1px solid var(--borde);border-radius:10px;padding:10px 12px;margin-top:8px;}
.dup-tipo{display:inline-block;background:rgba(255,211,61,.15);color:var(--aviso);border-radius:6px;padding:2px 8px;font-size:12px;font-weight:700;margin-right:8px;text-transform:uppercase;}
.dup-org{font-weight:700;}
.dup-sub{color:var(--suave);font-size:14px;margin-top:2px;}
.check-label{display:flex;align-items:flex-start;gap:10px;background:rgba(31,162,255,.08);border:1px solid var(--acento2);border-radius:10px;padding:12px;margin-top:14px;font-size:15px;cursor:pointer;}
.check-label input{margin-top:4px;}

.aliado{border:1px solid var(--borde);border-radius:14px;padding:16px;margin-top:14px;background:#0e1728;}
.aliado.anulado{border-color:var(--rojo);background:rgba(224,82,82,.06);}
.aliado-head{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:8px;}
.aliado-head strong{font-size:19px;}
.asignacion{background:#0b1220;border:1px solid var(--borde);border-radius:10px;padding:12px;margin-top:10px;}
.asignacion.anulada{border-color:var(--rojo);background:rgba(224,82,82,.08);}
.asig-top{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:8px;}
.asig-linea{color:var(--suave);font-size:15px;margin:2px 0;}
.asig-linea b{color:var(--texto);}

.modal-fondo{position:fixed;inset:0;background:rgba(4,8,16,.72);backdrop-filter:blur(2px);display:flex;align-items:center;justify-content:center;z-index:1000;padding:18px;animation:modalFade .15s ease;}
@keyframes modalFade{from{opacity:0}to{opacity:1}}
.modal-caja{background:var(--tarjeta);border:1px solid var(--borde);border-radius:16px;padding:22px;max-width:480px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.55);animation:modalPop .18s ease;}
.modal-caja-grande{max-width:660px;max-height:92vh;overflow-y:auto;}
.modal-caja-xl{max-width:920px;}
.grid-2col{display:grid;grid-template-columns:1fr 1fr;gap:8px 20px;}
.grid-2col label{margin:4px 0;}
.grid-2col .ancho-total{grid-column:1 / -1;}
@media (max-width:640px){.grid-2col{grid-template-columns:1fr;}}
@keyframes modalPop{from{transform:scale(.94);opacity:0}to{transform:scale(1);opacity:1}}
.modal-titulo{margin:0 0 12px;font-size:20px;color:var(--acento);}
.modal-mensaje{font-size:16px;line-height:1.55;color:var(--texto);margin-bottom:18px;}
.modal-botones{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;margin-top:16px;}
.modal-botones .btn{min-width:110px;padding:11px 16px;}
.modal-seccion{margin-bottom:14px;padding-bottom:14px;border-bottom:1px dashed var(--borde);}
.modal-seccion:last-child{border-bottom:none;padding-bottom:0;}
.modal-seccion h4{margin:0 0 8px;font-size:16px;color:var(--acento2);font-weight:700;}
</style>
</head>
<body>
<div class="franja"></div>
<header class="cabecera">
  <div class="logo">🤝</div>
  <div>
    <div class="ceja">Aliados</div>
    <h1>NitroSystem</h1>
  </div>
</header>
<main>

  <div class="fila" style="margin-top:0">
    <button class="btn btn-gris" id="btnVolverArriba">← Volver al dashboard</button>
  </div>

  <section class="tarjeta">
    <h2 class="centrado">🤝 Gestión de aliados</h2>
    <p class="suave centrado">Crea aliados, consulta sus asignaciones y gestiona sus cupones.</p>
    <div class="fila" style="justify-content:flex-end;margin-top:6px">
      <button class="btn btn-verde" id="btnNuevoAliado">➕ Nuevo aliado</button>
    </div>
    <div id="contenedorAliados" style="margin-top:14px"><p class="suave">Consultando...</p></div>
  </section>

  <div class="fila">
    <button class="btn btn-gris" id="btnVolverAbajo">← Volver al dashboard</button>
  </div>

</main>
<script src="js/aliados.js"></script>
</body>
</html>
