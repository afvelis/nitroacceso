<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NitroSystem - Dashboard</title>
<style>html,body{background:#0b1220;margin:0;}</style>
<script src="config.js"></script>
<script>
  // Chequeo temprano de sesión admin (sin destello).
  (function(){
    var s = leerSesion();
    if (!s || s.rol !== 'admin'){
      location.replace('index.html');
    }
  })();
</script>
<style>
:root{
  --fondo:#0b1220;--tarjeta:#121c2e;--borde:#24344d;--texto:#eef3f8;
  --suave:#9fb0c3;--acento:#35d07f;--acento2:#1fa2ff;--aviso:#ffd33d;
  --rojo:#e05252;--rojo2:#c73e3e;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:var(--fondo);color:var(--texto);font-size:17px;line-height:1.5;min-height:100vh;padding-bottom:40px}
.franja{height:6px;background:linear-gradient(90deg,var(--acento),var(--acento2))}
.cabecera{display:flex;align-items:center;gap:14px;padding:18px 20px;background:var(--tarjeta);border-bottom:1px solid var(--borde)}
.logo{font-size:28px;background:linear-gradient(135deg,var(--acento),var(--acento2));width:48px;height:48px;display:flex;align-items:center;justify-content:center;border-radius:10px}
.titulo{font-size:20px;font-weight:700}
.subtitulo{font-size:14px;color:var(--suave)}
.contenedor{max-width:1000px;margin:20px auto;padding:0 16px}
.atajo{display:flex;justify-content:flex-end;margin-bottom:12px}
.btn-atajo{padding:8px 16px;border-radius:999px;background:linear-gradient(135deg,#b06aff,#7a3ff2);color:white;text-decoration:none;font-weight:700;font-size:14px;box-shadow:0 3px 10px rgba(0,0,0,.3)}
.btn-atajo:active{transform:scale(.97)}
.tarjeta{background:var(--tarjeta);border:1px solid var(--borde);border-radius:16px;padding:20px;margin-bottom:18px;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.tarjeta h2{font-size:19px;margin-bottom:14px;color:var(--acento)}
.estado-evento{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:14px}
.estado-info{flex:1;min-width:200px}
.estado-pill{display:inline-block;padding:8px 16px;border-radius:24px;font-size:16px;font-weight:700}
.estado-abierto{background:rgba(53,208,127,.18);color:var(--acento);border:1px solid var(--acento)}
.estado-cerrado{background:rgba(224,82,82,.18);color:var(--rojo);border:1px solid var(--rojo)}
.grid-contadores{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-bottom:18px}
.contador{background:var(--tarjeta);border:1px solid var(--borde);border-radius:14px;padding:18px;text-align:center;box-shadow:0 4px 14px rgba(0,0,0,.2)}
.contador .numero{font-size:32px;font-weight:800;color:var(--acento);display:block}
.contador .etiqueta{font-size:14px;color:var(--texto);margin-top:6px;display:block;font-weight:600}
.contador .sub{font-size:12px;color:var(--suave);display:block;margin-top:4px}
.progreso-dia{margin-bottom:18px}
.progreso-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;flex-wrap:wrap;gap:8px}
.progreso-titulo{font-weight:700;font-size:16px}
.progreso-stats{font-size:14px;color:var(--suave)}
.barra-fondo{height:22px;background:#0d1626;border-radius:12px;overflow:hidden;border:1px solid var(--borde)}
.barra-relleno{height:100%;background:linear-gradient(90deg,var(--acento),#26a866);border-radius:12px;transition:width .6s ease;display:flex;align-items:center;justify-content:flex-end;padding-right:8px;font-size:12px;font-weight:700;color:white}
.accesos-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.btn{display:inline-block;padding:14px 18px;border:none;border-radius:10px;font-size:16px;font-weight:600;cursor:pointer;color:white;background:linear-gradient(135deg,var(--acento),#26a866);text-align:center;text-decoration:none;transition:transform .1s}
.btn:active{transform:scale(.97)}
.btn-azul{background:linear-gradient(135deg,var(--acento2),#147acc)}
.btn-gris{background:#2a3648}
.btn-rojo{background:linear-gradient(135deg,var(--rojo),var(--rojo2))}
.alerta{padding:12px 14px;border-radius:10px;margin-bottom:10px;font-size:15px}
.alerta-amarilla{background:rgba(255,211,61,.12);border:1px solid var(--aviso);color:var(--aviso)}
.alerta-roja{background:rgba(224,82,82,.12);border:1px solid var(--rojo);color:var(--rojo)}
.alerta-verde{background:rgba(53,208,127,.12);border:1px solid var(--acento);color:var(--acento)}
.alerta-clickeable{cursor:pointer;transition:opacity .15s}
.alerta-clickeable:hover{opacity:.85}
.pill-dia{display:inline-block;padding:4px 10px;border-radius:14px;font-size:13px;font-weight:700;background:rgba(31,162,255,.18);color:var(--acento2)}
.detalle-listas{margin-top:10px;padding-top:10px;border-top:1px dashed var(--aviso)}
.item-lista{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 10px;background:rgba(0,0,0,.25);border-radius:8px;margin-bottom:6px;flex-wrap:wrap}
.item-lista .info{flex:1;min-width:200px}
.item-lista .nombre{font-weight:600;font-size:15px}
.item-lista .meta{font-size:13px;color:var(--suave);margin-top:2px}
.item-lista .link-box{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;background:#0d1626;padding:4px 8px;border-radius:6px;word-break:break-all;color:var(--suave);margin-top:4px;display:block}
.btn-mini{padding:6px 12px;font-size:13px;border-radius:8px}
.pill-tipo{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:700;margin-right:6px}
.pill-tipo-talento{background:rgba(31,162,255,.2);color:var(--acento2)}
.pill-tipo-cortesia{background:rgba(186,104,255,.2);color:#c68cff}
</style>
</head>
<body>
<div class="franja"></div>
<header class="cabecera">
  <div class="logo">🚀</div>
  <div>
    <div class="titulo">NitroSystem</div>
    <div class="subtitulo">Panel principal del administrador</div>
  </div>
</header>

<main class="contenedor">
  <div class="atajo">
    <a href="cortesias.html" class="btn-atajo">🎁 Nueva cortesía</a>
    <a href="aliados.html" class="btn-atajo" style="margin-left:8px;background:linear-gradient(135deg,var(--acento),#26a866);color:#06281a">🤝 Aliados</a>
  </div>

  <div id="panelCarga" class="tarjeta">
    <p style="color:var(--suave)">Cargando resumen...</p>
  </div>

  <div id="panelContenido" style="display:none">
    <div class="tarjeta">
      <h2>📌 Estado del evento</h2>
      <div class="estado-evento">
        <div class="estado-info">
          <div style="margin-bottom:8px"><span id="pillEstado" class="estado-pill estado-abierto">Cargando...</span></div>
          <div style="color:var(--suave);font-size:15px">Día activo: <span id="diaActivo" class="pill-dia">-</span></div>
        </div>
        <button class="btn btn-rojo" id="btnToggleEdicion">🔒 Cerrar edición</button>
      </div>
    </div>

    <div class="grid-contadores" id="gridContadores"></div>

    <div class="tarjeta">
      <h2>🚪 Control de puerta por día</h2>
      <div id="progresoDias"></div>
    </div>

    <div class="tarjeta">
      <h2>⚡ Accesos rápidos</h2>
      <div class="accesos-grid">
        <a href="admin.html" class="btn btn-azul">🛠️ Gestión completa</a>
        <a href="estadisticas.html" class="btn btn-gris">📊 Estadísticas</a>
        <a href="aliados.html" class="btn btn-gris">🤝 Aliados</a>
        <a href="admin.html#historial" class="btn btn-gris">📄 Historial e informes</a>
        <a href="admin.html#crear-coordinador" class="btn btn-gris">➕ Crear coordinador</a>
      </div>
    </div>

    <div class="tarjeta">
      <h2>🔔 Alertas</h2>
      <div id="panelAlertas"></div>
    </div>

    <div class="tarjeta" style="text-align:center">
      <button class="btn btn-gris" id="btnSalir">🚪 Salir</button>
    </div>
  </div>
</main>

<script src="js/dashboard.js"></script>
</body>
</html>
